<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turnos Jefes de Servicio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Turnos Jefes de Servicio</h1>
      <p>Planificación independiente · 3 JS · cobertura 07:00–24:00</p>
    </div>
  </header>

  <main class="container">
    <section class="panel controls">
      <div class="field">
        <label for="weeks">Semanas a proyectar</label>
        <input id="weeks" type="number" min="1" max="52" value="8" />
      </div>

      <div class="field">
        <label for="js1">JS 1</label>
        <input id="js1" type="text" value="JS 1" />
      </div>

      <div class="field">
        <label for="js2">JS 2</label>
        <input id="js2" type="text" value="JS 2" />
      </div>

      <div class="field">
        <label for="js3">JS 3</label>
        <input id="js3" type="text" value="JS 3" />
      </div>

      <div class="actions">
        <button id="generateBtn">Generar horario</button>
        <button id="csvBtn" class="secondary">Exportar CSV</button>
      </div>
    </section>

    <section class="panel legend">
      <div><strong>M</strong> 07:00–15:00 · 8 h</div>
      <div><strong>T</strong> 15:00–24:00 · 9 h</div>
      <div><strong>R</strong> 10:00–17:00 · 7 h</div>
      <div><strong>L</strong> Libre</div>
    </section>

    <section class="panel" id="validationPanel">
      <h2>Validación</h2>
      <div id="validation"></div>
    </section>

    <section class="panel">
      <h2>Resumen</h2>
      <div id="summary"></div>
    </section>

    <section class="panel">
      <h2>Proyección</h2>
      <div class="table-wrap">
        <table id="scheduleTable">
          <thead>
            <tr>
              <th>Semana</th>
              <th>Día</th>
              <th id="head1">JS 1</th>
              <th id="head2">JS 2</th>
              <th id="head3">JS 3</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
