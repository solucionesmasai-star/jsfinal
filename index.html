<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turnos Jefes de Servicio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Turnos Jefes de Servicio</h1>
      <p>Calendario mensual · ciclo continuo · domingos con mínimo 1 JS</p>
    </div>
  </header>

  <main class="container">
    <section class="panel controls">
      <div class="field">
        <label for="monthPicker">Mes a proyectar</label>
        <input id="monthPicker" type="month" />
      </div>

      <div class="field">
        <label for="cycleStart">Inicio del ciclo</label>
        <input id="cycleStart" type="date" />
        <small>Se ajusta automáticamente al lunes.</small>
      </div>

      <div class="field">
        <label for="js1">JS 1</label>
        <input id="js1" type="text" value="JS 1" />
      </div>

      <div class="field">
        <label for="js2">JS 2</label>
        <input id="js2" type="text" value="JS 2" />
      </div>

      <div class="field">
        <label for="js3">JS 3</label>
        <input id="js3" type="text" value="JS 3" />
      </div>

      <div class="actions">
        <button id="prevMonth" class="secondary">← Mes anterior</button>
        <button id="generateBtn">Generar</button>
        <button id="nextMonth" class="secondary">Mes siguiente →</button>
        <button id="csvBtn" class="secondary">Exportar CSV</button>
      </div>
    </section>

    <section class="panel legend">
      <div><strong>M</strong> 07:00–15:00 · 8 h</div>
      <div><strong>T</strong> 15:00–24:00 · 9 h</div>
      <div><strong>R</strong> 10:00–17:00 · 7 h</div>
      <div><strong>L</strong> Libre</div>
    </section>

    <section class="panel" id="validationPanel">
      <h2>Validación</h2>
      <div id="validation"></div>
    </section>

    <section class="panel">
      <h2>Resumen mensual</h2>
      <div id="summary"></div>
    </section>

    <section class="panel">
      <div class="calendar-title-row">
        <h2 id="calendarTitle">Calendario</h2>
        <span class="cycle-note">El ciclo continúa entre meses y años.</span>
      </div>
      <div class="calendar-wrap">
        <div id="calendarHeads" class="calendar-heads"></div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
